name: Require category label

on:
  issues:
    types: [opened, labeled, unlabeled, reopened]

jobs:
  check-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Require one category label
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: |
            frontend
            backend
            extension
            docs
          message: '⚠️ Bitte mindestens ein Kategorie-Label setzen ({{ provided }} gesetzt, {{ applied }} aus der Liste). Erlaubt: {{ label_list }}'
          add_comment: true
          exit_type: failure
